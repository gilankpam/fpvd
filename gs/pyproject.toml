[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fpvdgs"
version = "0.1.0"
description = "fpvd ground-station wfb supervisor"
requires-python = ">=3.11"

[project.scripts]
fpvd = "fpvdgs.supervisor:main"
fpvd-runner = "fpvdgs.runner:main"
fpvd-stats = "fpvdgs.wfb.cli:main"

[tool.setuptools.packages.find]
include = ["fpvdgs*"]

[tool.setuptools.package-data]
"fpvdgs.dynlink" = ["profiles/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
# `ruff format` owns code line length; E501 then only fires on long
# comments/docstrings (e.g. wire-format layouts) the formatter won't wrap.
ignore = ["E501"]
